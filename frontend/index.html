<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QueryBridge Chat</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --panel-alt: #1b2438;
        --primary: #7dd3fc;
        --primary-dark: #38bdf8;
        --text: #e5edf9;
        --muted: #9db0c6;
        --bot: #1f2b3c;
        --user: #193a4c;
        --border: rgba(255, 255, 255, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0b1020, #172033);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .chat-shell {
        width: min(900px, 92vw);
        height: min(85vh, 800px);
        background: rgba(18, 26, 43, 0.95);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .topbar {
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
      }

      .topbar h1 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 700;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: rgba(7, 12, 20, 0.2);
      }

      .message {
        max-width: 78%;
        padding: 14px 16px;
        border-radius: 18px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .bot {
        align-self: flex-start;
        background: var(--bot);
        border: 1px solid var(--border);
        color: var(--text);
      }

      .user {
        align-self: flex-end;
        background: var(--user);
        border: 1px solid rgba(125, 211, 252, 0.2);
      }

      .composer {
        display: flex;
        gap: 12px;
        padding: 16px 18px 18px;
        border-top: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
      }

      input {
        flex: 1;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
      }

      input:focus {
        border-color: rgba(125, 211, 252, 0.8);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }

      button {
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #071018;
        font-weight: 700;
        padding: 0 22px;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
    </style>
  </head>
  <body>
    <div class="chat-shell">
      <div class="topbar">
        <h1>QueryBridge AI</h1>
      </div>

      <div class="messages" id="messages">
        <div class="message bot">Hi! Ask me about employee salary data, such as “what is the base salary of Bob Smith?”</div>
      </div>

      <div class="composer">
        <input id="question" type="text" placeholder="Ask a question about employee salary..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById('messages');
      const questionEl = document.getElementById('question');
      const sendBtn = document.getElementById('sendBtn');

      function appendMessage(text, type = 'bot') {
        const el = document.createElement('div');
        el.className = `message ${type}`;
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function sendQuestion() {
        const question = questionEl.value.trim();
        if (!question) return;

        appendMessage(question, 'user');
        questionEl.value = '';
        sendBtn.disabled = true;

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question })
          });

          const contentType = response.headers.get('content-type') || '';
          const data = contentType.includes('application/json') ? await response.json() : { answer: await response.text() };

          if (!response.ok) {
            throw new Error(data.detail || 'Request failed');
          }

          appendMessage(data.answer || 'No answer returned.', 'bot');
        } catch (err) {
          appendMessage(`Error: ${err.message}`, 'bot');
        } finally {
          sendBtn.disabled = false;
          questionEl.focus();
        }
      }

      sendBtn.addEventListener('click', sendQuestion);
      questionEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          sendQuestion();
        }
      });
    </script>
  </body>
</html>
